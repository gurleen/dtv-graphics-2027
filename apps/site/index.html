<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dragons TV Graphics Preview</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="masthead">
      <h1>Dragons TV Graphics</h1>
      <span>Preview</span>
    </header>
    <div class="layout">
      <nav id="list" aria-label="Graphics"></nav>
      <main>
        <section class="heading">
          <h2 id="title"></h2>
        </section>
        <div id="stage" data-backdrop="checker">
          <p id="status" role="status"></p>
        </div>
        <div class="controls">
          <button id="show" type="button">Show</button>
          <button id="hide" type="button">Hide</button>
          <button id="previous" type="button" hidden>Previous step</button>
          <button id="next" type="button" hidden>Next step</button>
          <span class="spacer"></span>
          <label id="scorebug-toggle" hidden><input id="scorebug" type="checkbox" checked /> Scorebug</label>
          <label>
            Backdrop
            <select id="backdrop">
              <option value="checker" selected>Transparency</option>
              <option value="video">Dark</option>
            </select>
          </label>
        </div>
        <details id="content">
          <summary>Edit content</summary>
          <p id="form-error" role="alert"></p>
          <form id="fields"></form>
          <button id="reset" type="button">Reset to defaults</button>
        </details>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
